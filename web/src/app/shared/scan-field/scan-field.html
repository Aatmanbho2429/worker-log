<div class="scan-field">
  <label class="scan-field__label" for="scan-code">
    <i class="scan-field__label-icon pi pi-qrcode"></i>
    {{ 'scanField.label' | translate }}
  </label>

  <input
    #box
    id="scan-code"
    class="scan-field__input"
    type="text"
    inputmode="numeric"
    autocomplete="off"
    spellcheck="false"
    [placeholder]="'scanField.placeholder' | translate"
    [value]="code()"
    (input)="onInput(box.value)"
    (keyup.enter)="submit()"
  />

  <p-button
    icon="pi pi-check"
    size="large"
    [label]="'scanField.record' | translate"
    [disabled]="!ready()"
    [loading]="busy()"
    (onClick)="submit()"
  />

  @if (!showResult()) {
    <!-- The host screen reports the outcome itself. -->
  } @else if (problem(); as issue) {
    <div class="scan-field__result scan-field__result--problem" role="alert">
      <i class="pi pi-exclamation-triangle"></i>
      <span>{{ issue }}</span>
      <button type="button" class="scan-field__dismiss" (click)="dismiss()">
        {{ 'scanField.dismiss' | translate }}
      </button>
    </div>
  } @else if (last(); as entry) {
    <div class="scan-field__result scan-field__result--ok" role="status">
      <i class="pi pi-check-circle"></i>
      <span>
        <span class="scan-field__result-value">{{ entry.workerName }}</span>
        · {{ entry.reasonName }} · {{ entry.gradeName }}
      </span>
    </div>
  } @else {
    <span class="scan-field__hint">{{ 'scanField.hint' | translate }}</span>
  }
</div>
