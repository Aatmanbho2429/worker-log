<div class="range-filter">
  <div class="range-filter__presets">
    @for (preset of presets; track preset.key; let first = $first, last = $last) {
      <button
        type="button"
        class="range-filter__preset"
        [class.range-filter__preset--first]="first"
        [class.range-filter__preset--last]="last"
        [class.range-filter__preset--active]="isPreset(preset.key)"
        [disabled]="busy()"
        (click)="applyPreset(preset.key)"
      >
        {{ preset.label }}
      </button>
    }
  </div>

  <div class="range-filter__dates">
    <label class="range-filter__field">
      <span class="range-filter__label">{{ 'rangeFilter.from' | translate }}</span>
      <p-datepicker
        [ngModel]="fromDate()"
        (ngModelChange)="setFrom($event)"
        dateFormat="dd M yy"
        [showIcon]="true"
        [disabled]="busy()"
        appendTo="body"
        inputStyleClass="range-filter__input"
      />
    </label>

    <label class="range-filter__field">
      <span class="range-filter__label">{{ 'rangeFilter.to' | translate }}</span>
      <p-datepicker
        [ngModel]="toDate()"
        (ngModelChange)="setTo($event)"
        dateFormat="dd M yy"
        [showIcon]="true"
        [disabled]="busy()"
        appendTo="body"
        inputStyleClass="range-filter__input"
      />
    </label>

    <label class="range-filter__field">
      <span class="range-filter__label">{{ 'rangeFilter.series' | translate }}</span>
      <p-select
        [options]="seriesOptions()"
        [ngModel]="value().seriesId"
        (ngModelChange)="setSeries($event)"
        optionLabel="label"
        optionValue="value"
        [disabled]="busy()"
        appendTo="body"
        styleClass="range-filter__select"
      />
    </label>
  </div>
</div>
