<div class="filter">
  <div class="filter__presets">
    @for (preset of presets; track preset.key) {
      <button
        type="button"
        class="filter__preset"
        [class.filter__preset--active]="isPreset(preset.key)"
        [disabled]="busy()"
        (click)="applyPreset(preset.key)"
      >
        {{ preset.label }}
      </button>
    }
  </div>

  <div class="filter__dates">
    <label class="filter__field">
      <span class="filter__label">{{ 'rangeFilter.from' | translate }}</span>
      <p-datepicker
        [ngModel]="fromDate()"
        (ngModelChange)="setFrom($event)"
        dateFormat="dd M yy"
        [showIcon]="true"
        [disabled]="busy()"
        appendTo="body"
        inputStyleClass="filter__input"
      />
    </label>

    <label class="filter__field">
      <span class="filter__label">{{ 'rangeFilter.to' | translate }}</span>
      <p-datepicker
        [ngModel]="toDate()"
        (ngModelChange)="setTo($event)"
        dateFormat="dd M yy"
        [showIcon]="true"
        [disabled]="busy()"
        appendTo="body"
        inputStyleClass="filter__input"
      />
    </label>

    <label class="filter__field">
      <span class="filter__label">{{ 'rangeFilter.series' | translate }}</span>
      <p-select
        [options]="seriesOptions()"
        [ngModel]="value().seriesId"
        (ngModelChange)="setSeries($event)"
        optionLabel="label"
        optionValue="value"
        [disabled]="busy()"
        appendTo="body"
        styleClass="filter__select"
      />
    </label>
  </div>
</div>
