<section class="page">
  <header class="page__head">
    <div>
      <h1 class="page__title">Settings</h1>
      <p class="page__subtitle">Where the register is kept, and demo data for trying things out.</p>
    </div>
  </header>

  <div class="card card--pad">
    <h2 class="card__title settings__heading">Application</h2>

    <dl class="settings__facts">
      <dt>Version</dt>
      <dd class="tabular">{{ info()?.version ?? '—' }}</dd>

      <dt>Database file</dt>
      <dd class="settings__path">{{ info()?.databasePath ?? '—' }}</dd>
    </dl>

    <p class="settings__note">
      Everything is stored in that one file. Copy it to back the register up, or to move it to
      another machine.
    </p>
  </div>
</section>
