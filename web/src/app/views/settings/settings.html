<section class="page">
  <header class="page__head">
    <div>
      <h1 class="page__title">{{ 'settings.title' | translate }}</h1>
      <p class="page__subtitle">{{ 'settings.subtitle' | translate }}</p>
    </div>
  </header>

  <div class="card card--pad">
    <h2 class="card__title settings__heading">{{ 'settings.application' | translate }}</h2>

    <dl class="settings__facts">
      <dt>{{ 'settings.version' | translate }}</dt>
      <dd class="tabular">{{ info()?.version ?? '—' }}</dd>

      <dt>{{ 'settings.databaseFile' | translate }}</dt>
      <dd class="settings__path">{{ info()?.databasePath ?? '—' }}</dd>
    </dl>

    <p class="settings__note">{{ 'settings.note' | translate }}</p>
  </div>
</section>
