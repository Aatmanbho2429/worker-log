<section class="page">
  <header class="page__head">
    <div>
      <h1 class="page__title">{{ 'settings.title' | translate }}</h1>
      <p class="page__subtitle">{{ 'settings.subtitle' | translate }}</p>
    </div>
  </header>

  <div class="card card--padded">
    <h2 class="card__title settings__heading">{{ 'settings.application' | translate }}</h2>

    <dl class="settings__facts">
      <dt class="settings__fact-term">{{ 'settings.version' | translate }}</dt>
      <dd class="settings__fact-value">{{ info()?.version ?? '—' }}</dd>

      <dt class="settings__fact-term">{{ 'settings.databaseFile' | translate }}</dt>
      <dd class="settings__fact-value settings__path">{{ info()?.databasePath ?? '—' }}</dd>
    </dl>

    <p class="settings__note">{{ 'settings.note' | translate }}</p>

    <div class="settings__actions">
      <p-button
        [label]="'update.checkNow' | translate"
        icon="pi pi-refresh"
        severity="secondary"
        [loading]="updates.checking()"
        (onClick)="checkForUpdates()"
      />
    </div>
  </div>
</section>
