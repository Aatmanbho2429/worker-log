[package]
name = "worker-log"
version = "0.1.0"
edition = "2024"
description = "Ceramic sanitaryware waste log"
authors = ["Aatman Bhoraniya"]
default-run = "worker-log"

[lib]
name = "worker_log_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"
machine-uid = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
