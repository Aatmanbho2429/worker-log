# Only read by the Supabase CLI. If you deploy by pasting into the dashboard,
# this file does nothing — turn Verify JWT off there instead.
project_id = "worker-log"

# None of these can require a verified JWT at the platform level, because
# `supabase::call_function` (src-tauri/src/supabase.rs) always calls with the
# anon key as the bearer token — the account functions are called before
# anybody is signed in, and `validate-token` carries the operator's own token
# in its request body instead of the header, checking it itself with
# `auth.getUser()`. Each does its own checking: `register` and
# `forgot-password` validate their input, `login` verifies the password, and
# `validate-token` verifies the token, before any of them decides anything.
#
# `send-otp` is the most exposed of them — it will mail anybody who asks — so
# its checking is rate limiting rather than authentication: one code a minute
# and five an hour per address, enforced in the function.
#
# `get-plans` is exposed further still: no checking at all, not even a rate
# limit. It asks for nothing because it hands back nothing but a public price
# list, read with the service role key so a caller need not even hold a valid
# token — which is the point, since the operator this exists for is the one
# whose subscription just ran out.
#
# `create-order` and `verify-payment` carry the operator's `accessToken` in
# the body (same pattern as `validate-token`) and check it with
# `auth.getUser()` before doing anything privileged. `verify-payment` also
# recomputes the Razorpay HMAC signature itself — that check, not the
# platform's JWT verification, is what proves the payment is real.
[functions.send-otp]
verify_jwt = false

[functions.get-plans]
verify_jwt = false

[functions.create-order]
verify_jwt = false

[functions.verify-payment]
verify_jwt = false

[functions.register]
verify_jwt = false

[functions.login]
verify_jwt = false

[functions.validate-token]
verify_jwt = false

[functions.forgot-password]
verify_jwt = false
